<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live-интервью</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 20px; text-align: center; }
        h1 { font-size: 18px; }
        #meta { color: #888; font-size: 13px; margin-bottom: 10px; }
        #progress { color: #999; font-size: 13px; }
        #question { font-size: 16px; margin: 20px 0; color: #333; white-space: pre-wrap; }
        button { font-size: 18px; padding: 16px 32px; border-radius: 12px; border: none; background: #2481cc; color: white; margin-top: 10px; }
        button:disabled { background: #ccc; }
        #codeInput {
            width: 100%; box-sizing: border-box; min-height: 240px; padding: 14px;
            background: #1e1e1e; color: #d4d4d4; border: none; border-radius: 12px;
            font-family: Consolas, "Courier New", monospace; font-size: 14px;
            text-align: left; tab-size: 4; resize: vertical;
        }
        #status { margin-top: 15px; color: #666; font-size: 14px; }
        #evaluation { margin-top: 20px; text-align: left; background: white; padding: 15px; border-radius: 12px; white-space: pre-wrap; }
        #evaluation:empty { display: none; }
    </style>
</head>
<body>
    <h1>🎙 Live-интервью (бета)</h1>
    <div id="meta"></div>
    <div id="progress"></div>
    <div id="question">Загрузка вопроса...</div>

    <div id="voicePanel">
        <button id="recordBtn">🔴 Начать запись</button>
    </div>

    <div id="codePanel" style="display:none">
        <textarea id="codeInput" spellcheck="false" placeholder="# Напиши решение здесь"></textarea>
        <button id="submitCodeBtn">▶ Отправить код</button>
    </div>

    <div id="status"></div>
    <div id="evaluation"></div>
    <button id="nextBtn" style="display:none">➡️ Следующий вопрос</button>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const params = new URLSearchParams(window.location.search);
        const position = params.get("position");
        const level = params.get("level");
        const userId = Telegram.WebApp.initDataUnsafe?.user?.id || 0;

        // Без этого заголовка бесплатный ngrok может подменять ответ HTML-страницей-предупреждением
        const NGROK_HEADERS = { "ngrok-skip-browser-warning": "true" };

        const recordBtn = document.getElementById("recordBtn");
        const submitCodeBtn = document.getElementById("submitCodeBtn");
        const nextBtn = document.getElementById("nextBtn");
        const voicePanel = document.getElementById("voicePanel");
        const codePanel = document.getElementById("codePanel");
        const codeInput = document.getElementById("codeInput");
        const statusEl = document.getElementById("status");
        const evaluationEl = document.getElementById("evaluation");

        let questions = [];
        let currentIndex = 0;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function loadQuestions() {
            try {
                const res = await fetch(`/api/questions?position=${position}&level=${level}`, { headers: NGROK_HEADERS });
                const data = await res.json();
                questions = data.questions;
                document.getElementById("meta").innerText = `${data.position_title} · ${data.level_title}`;
                showQuestion();
            } catch (err) {
                document.getElementById("question").innerText = "Не удалось загрузить вопросы: " + err.message;
            }
        }

        function showQuestion() {
            nextBtn.style.display = "none";
            evaluationEl.innerText = "";
            statusEl.innerText = "";

            if (currentIndex >= questions.length) {
                document.getElementById("question").innerText = "Интервью завершено 🎉";
                document.getElementById("progress").innerText = "";
                voicePanel.style.display = "none";
                codePanel.style.display = "none";
                return;
            }

            const q = questions[currentIndex];
            const isCoding = q.type === "coding";
            const label = isCoding ? "💻 Live-coding" : "Вопрос";
            document.getElementById("progress").innerText = `${label} ${currentIndex + 1} из ${questions.length}`;
            document.getElementById("question").innerText = q.text;

            voicePanel.style.display = isCoding ? "none" : "block";
            codePanel.style.display = isCoding ? "block" : "none";
            codeInput.value = "";
            setBusy(false);
        }

        function setBusy(busy) {
            recordBtn.disabled = busy;
            submitCodeBtn.disabled = busy;
        }

        function baseFields(q) {
            const fd = new FormData();
            fd.append("question_text", q.text);
            fd.append("question_type", q.type);
            fd.append("position", position);
            fd.append("level", level);
            fd.append("user_id", userId);
            return fd;
        }

        // Общая логика отправки: и для голоса, и для кода
        async function submitAnswer(url, formData) {
            setBusy(true);
            statusEl.innerText = "Оцениваю ответ...";
            try {
                const response = await fetch(url, { method: "POST", body: formData, headers: NGROK_HEADERS });
                // Сначала читаем как текст, чтобы при ошибке увидеть, что именно вернул сервер
                const rawText = await response.text();

                if (!response.ok) {
                    statusEl.innerText = `Ошибка сервера (${response.status})`;
                    evaluationEl.innerText = rawText.slice(0, 500);
                    setBusy(false);
                    return;
                }

                const data = JSON.parse(rawText);
                evaluationEl.innerText = data.evaluation_text;

                if (data.failed) {
                    // Gemini перегружен: вопрос не засчитан, можно отправить ещё раз
                    statusEl.innerText = "";
                    setBusy(false);
                    return;
                }

                statusEl.innerText = "";
                nextBtn.innerText = currentIndex + 1 >= questions.length ? "🏁 Завершить" : "➡️ Следующий вопрос";
                nextBtn.style.display = "inline-block";
                speak(data.evaluation_text);
            } catch (err) {
                statusEl.innerText = "Ошибка: " + err.message;
                setBusy(false);
            }
        }

        // Озвучка встроенным голосом браузера: мгновенно, без запросов к серверу
        function cleanForSpeech(text) {
            return text.replace(/[*_`#>]/g, "").replace(/\s+/g, " ").trim();
        }

        function speak(text) {
            if (!("speechSynthesis" in window)) return;
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(cleanForSpeech(text));
            utterance.lang = "ru-RU";
            speechSynthesis.speak(utterance);
        }

        recordBtn.addEventListener("click", async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        // Освобождаем микрофон, чтобы индикатор записи не висел
                        stream.getTracks().forEach((t) => t.stop());
                        sendVoice();
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.innerText = "⏹ Остановить и отправить";
                    statusEl.innerText = "Идёт запись...";
                } catch (err) {
                    statusEl.innerText = "Нет доступа к микрофону: " + err.message;
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🔴 Начать запись";
            }
        });

        function sendVoice() {
            const q = questions[currentIndex];
            const fd = baseFields(q);
            fd.append("audio", new Blob(audioChunks, { type: "audio/webm" }), "answer.webm");
            submitAnswer("/api/answer", fd);
        }

        submitCodeBtn.addEventListener("click", () => {
            const code = codeInput.value.trim();
            if (!code) {
                statusEl.innerText = "Сначала напиши код";
                return;
            }
            const q = questions[currentIndex];
            const fd = baseFields(q);
            fd.append("code", code);
            submitAnswer("/api/answer_code", fd);
        });

        // Tab вставляет отступ в поле кода, а не уводит фокус
        codeInput.addEventListener("keydown", (e) => {
            if (e.key === "Tab") {
                e.preventDefault();
                const start = codeInput.selectionStart;
                codeInput.setRangeText("    ", start, codeInput.selectionEnd, "end");
            }
        });

        nextBtn.addEventListener("click", () => {
            if ("speechSynthesis" in window) speechSynthesis.cancel();
            currentIndex++;
            showQuestion();
        });

        loadQuestions();
    </script>
</body>
</html>
